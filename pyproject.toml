[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-runtime"
version = "0.1.0"
description = "Reliable Context Control for Long-Horizon Multi-Agent Coding: Event-Sourced State, Versioned Adaptive Memory, and Risk-Aware Context Compilation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ARC Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "scipy>=1.10.0",
]

[project.scripts]
arc = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "state*", "memory*", "indexes*", "context*", "isolation*", "adapters*", "verification*", "eval*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
