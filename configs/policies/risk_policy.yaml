policy_name: risk_aware_adaptive
description: Dynamic risk-aware budget allocation and context compilation

risk_thresholds:
  low_cutoff: 0.3
  high_cutoff: 0.7

multipliers:
  low_risk: 0.70
  medium_risk: 1.00
  high_risk: 1.25

allocation_shift_on_high_risk:
  increase_code_evidence: 1.3
  increase_failure_history: 1.5
  increase_decisions: 1.2
  decrease_episodes: 0.5
